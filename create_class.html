  <!-- Matches CLASSES(RANK, DAY, TIME, LOCATION, INSTRUCTOR_ID) -->
  <form action="/CSI_3450/SQLInjection/class/create_class.php" method="POST">
    <label for="rank">Rank:</label><br>
<select id="rank" name="rank" required>
  <option value="">--Select Rank--</option>
  <option value="Beginner">Beginner</option>
  <option value="Intermediate">Intermediate</option>
  <option value="Advanced">Advanced</option>
</select><br><br>

    <label for="day">Day:</label><br>
    <select id="day" name="day" required>
      <option value="">--Select Day--</option>
      <option>Monday</option>
      <option>Tuesday</option>
      <option>Wednesday</option>
      <option>Thursday</option>
      <option>Friday</option>
      <option>Saturday</option>
      <option>Sunday</option>
    </select><br><br>

    <label for="time">Time:</label><br>
    <input type="time" id="time" name="time" required><br><br>

    <label for="location">Location:</label><br>
    <input type="text" id="location" name="location" required><br><br>

    <label for="instructor_id">Instructor ID:</label><br>
    <input type="number" id="instructor_id" name="instructor_id" required><br><br>

    <input type="submit" value="Create Class">
